<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FocusTask — Aesthetic To-Do</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">
            <div class="logo-icon">
                ✦
            </div>
            FocusTask
        </div>

        <button
            class="theme-btn"
            id="themeBtn"
            onclick="toggleTheme()">
            ☾
        </button>
    </nav>


    <!-- MAIN -->
    <main class="container">

        <!-- HERO -->
        <section class="hero">

            <div class="hero-text">
                <h1>
                    Make today count. ✨
                </h1>

                <p>
                    A little progress every day adds up.
                </p>
            </div>

            <div
                class="date-label"
                id="todayDate">
                Today
            </div>

        </section>


        <!-- STATISTICS -->
        <section class="stats">

            <div class="stat">

                <div class="stat-top">
                    <span>
                        Total tasks
                    </span>

                    <div class="stat-icon">
                        ☷
                    </div>
                </div>

                <h2 id="totalCount">
                    0
                </h2>

            </div>


            <div class="stat">

                <div class="stat-top">
                    <span>
                        Completed
                    </span>

                    <div class="stat-icon">
                        ✓
                    </div>
                </div>

                <h2 id="completedCount">
                    0
                </h2>

            </div>


            <div class="stat">

                <div class="stat-top">
                    <span>
                        Remaining
                    </span>

                    <div class="stat-icon">
                        ○
                    </div>
                </div>

                <h2 id="pendingCount">
                    0
                </h2>

            </div>

        </section>


        <!-- PROGRESS -->
        <section class="progress-card">

            <div class="progress-heading">

                <strong>
                    Daily progress
                </strong>

                <span id="progressText">
                    0%
                </span>

            </div>

            <div class="progress-track">

                <div id="progress"></div>

            </div>

        </section>


        <!-- TODO APP -->
        <section class="app-card">

            <!-- ADD TASK -->
            <div class="input-row">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What would you like to accomplish?"
                >

                <select id="priority">

                    <option value="High">
                        🔴 High
                    </option>

                    <option
                        value="Medium"
                        selected>
                        🟠 Medium
                    </option>

                    <option value="Low">
                        🟢 Low
                    </option>

                </select>


                <input
                    type="date"
                    id="dueDate"
                >


                <button
                    class="add-btn"
                    onclick="addTask()">
                    + Add Task
                </button>

            </div>


            <!-- SEARCH -->
            <input
                class="search"
                id="searchInput"
                type="text"
                placeholder="⌕  Search your tasks..."
                oninput="renderTasks()"
            >


            <!-- TOOLBAR -->
            <div class="toolbar">

                <div class="filters">

                    <button
                        class="filter-btn active"
                        onclick="setFilter('all', this)">
                        All
                    </button>

                    <button
                        class="filter-btn"
                        onclick="setFilter('active', this)">
                        Active
                    </button>

                    <button
                        class="filter-btn"
                        onclick="setFilter('completed', this)">
                        Completed
                    </button>

                </div>


                <button
                    class="clear-btn"
                    onclick="clearCompleted()">
                    Clear completed
                </button>

            </div>


            <!-- TASK LIST -->
            <ul id="taskList"></ul>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-line"></div>

        <p>
            Built with

            <span class="heart">
                ♥
            </span>

            by

            <strong>
                Prioma Das
            </strong>
        </p>

        <span class="footer-small">
            © 2026 FocusTask · Made with care ✨
        </span>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
